version: '3'
services:
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: counter
      POSTGRES_USER: postgres
      POSTGRES_DB: unicis_platform
    ports:
      - 5432:5432
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    profiles: ['frontend']
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    restart: always
    environment:
      DATABASE_URL: 'postgresql://postgres:counter@db:5432/unicis_platform?schema=public'
      NODE_ENV: 'production'
      PORT: 3000
      APP_URL: 'http://localhost:3000'
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 3000:3000

  jobrunner:
    profiles: ['jobrunner']
    build:
      context: .
      dockerfile: apps/jobrunner/Dockerfile
    restart: always
    environment:
      DATABASE_URL: 'postgresql://postgres:counter@db:5432/unicis_platform?schema=public'
      NODE_ENV: 'production'
      PORT: 3001
      JOB_POLL_INTERVAL_MS: 5000
      MAX_CONCURRENT_JOBS: 3
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 3001:3001
